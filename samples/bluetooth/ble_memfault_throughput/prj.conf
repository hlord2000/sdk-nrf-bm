# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_BM_UARTE=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SAMPLE_BLE_MEMFAULT_THROUGHPUT_LOG_LEVEL_INF=y

# SoftDevice
CONFIG_SOFTDEVICE=y
CONFIG_NRF_SDH_LOG_SD_INFO=y
CONFIG_NRF_SDH_BLE_LOG_SD_RAM_USAGE=y
CONFIG_NRF_SDH_BLE_VS_UUID_COUNT=4
CONFIG_NRF_SDH_BLE_GAP_EVENT_LENGTH=3200
CONFIG_NRF_SDH_BLE_CONN_EVT_EXT=y
CONFIG_NRF_SDH_BLE_GATT_MAX_MTU_SIZE=247
CONFIG_NRF_SDH_BLE_GATTS_HVN_TX_QUEUE_SIZE=32
CONFIG_NRF_SDH_BLE_GATTS_ATTR_TAB_SIZE=4096

# Dispatch SoftDevice events in main() so shell commands, logging, and
# throughput pumping all run from the main loop.
CONFIG_BM_SCHEDULER=y
CONFIG_BM_SCHEDULER_BUF_SIZE=1024
CONFIG_NRF_SDH_DISPATCH_MODEL_SCHED=y

# Enable RNG for SoftDevice random seeding
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# Advertising library
CONFIG_BLE_ADV=y
CONFIG_BLE_ADV_RESTART_ON_DISCONNECT=y
CONFIG_BLE_ADV_FAST_ADVERTISING_INTERVAL=32
CONFIG_BLE_ADV_FAST_ADVERTISING_TIMEOUT=0
CONFIG_BLE_ADV_SLOW_ADVERTISING=n

# BLE connection parameters: keep the default compatible with the Zephyr
# MCUmgr-over-BLE path used by nRF Connect Device Manager. Longer eData
# characterization intervals, such as 400 ms or 4000 ms, should be requested
# explicitly from the sample shell after the app/host has connected.
CONFIG_BLE_CONN_PARAMS=y
CONFIG_BLE_CONN_PARAMS_MIN_CONN_INTERVAL=6
CONFIG_BLE_CONN_PARAMS_MAX_CONN_INTERVAL=9
CONFIG_BLE_CONN_PARAMS_PERIPHERAL_LATENCY=0
CONFIG_BLE_CONN_PARAMS_SUP_TIMEOUT=42
CONFIG_BLE_CONN_PARAMS_MAX_PERIPHERAL_LATENCY_DEVIATION=499
CONFIG_BLE_CONN_PARAMS_MAX_SUP_TIMEOUT_DEVIATION=3190
CONFIG_BLE_CONN_PARAMS_NEGOTIATION_RETRIES=3
CONFIG_BLE_CONN_PARAMS_DISCONNECT_ON_FAILURE=n
CONFIG_BLE_CONN_PARAMS_INITIATE_ATT_MTU_EXCHANGE=y
CONFIG_BLE_CONN_PARAMS_DATA_LENGTH_RX=251
CONFIG_BLE_CONN_PARAMS_DATA_LENGTH_TX=251
CONFIG_BLE_CONN_PARAMS_INITIATE_DATA_LENGTH_UPDATE=y
CONFIG_BLE_CONN_PARAMS_PHY_2MBPS=y
CONFIG_BLE_CONN_PARAMS_INITIATE_PHY_UPDATE=y

# Nordic UART Service provides the high-throughput notify/write pipe.
CONFIG_BLE_NUS=y
CONFIG_BLE_QWR=y

# Device Manager / Memfault gateway identity.
CONFIG_BLE_DIS=y
CONFIG_BLE_DIS_MANUFACTURER_NAME="Nordic Semiconductor"
CONFIG_BLE_DIS_MODEL_NUMBER="bm_nrf54l15dk"
CONFIG_BLE_DIS_SERIAL_NUMBER="mfltqs1"
CONFIG_BLE_DIS_HW_REVISION="nRF54L15DK"
CONFIG_BLE_DIS_FW_REVISION="0.1.0"
CONFIG_BLE_DIS_SW_REVISION="bm-ble-throughput"

# Buttonless OTA entry and Memfault-over-SMP support for the bare-metal
# MCUboot firmware loader.
CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_ZEPHYR_QUEUE=y
CONFIG_NCS_BM_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_REASSEMBLY=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_MCUMGR_GRP_OS_RESET_BOOT_MODE=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_BLE_MCUMGR=y
CONFIG_BLE_MDS=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_BM_UARTE=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HISTORY=y
CONFIG_SAMPLE_BLE_MEMFAULT_THROUGHPUT_TX_WINDOW=32

# Memfault: no IP transport is available on this BLE peripheral sample, so data
# is reported through the built-in `mflt export` shell command and captured logs.
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NRF_CONNECT_SDK=n
CONFIG_MEMFAULT_NCS_PROJECT_KEY="r2z5NNkTA69kwIbmJ9hkG9WgZYDaBCtQ"
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_MCUMGR_GRP=y
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOGGING_RAM_SIZE=4096
CONFIG_MEMFAULT_LOG_LEVEL_INF=y
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=2048
CONFIG_MEMFAULT_METRICS=y
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_MEMFAULT_METRICS_TIMER_CUSTOM=y
CONFIG_MEMFAULT_METRICS_DEFAULT_SET_ENABLE=n
CONFIG_MEMFAULT_METRICS_THREADS=n
CONFIG_MEMFAULT_METRICS_MEMORY_USAGE=n
CONFIG_MEMFAULT_METRICS_BOOT_TIME=n
CONFIG_MEMFAULT_NCS_STACK_METRICS=n
CONFIG_MEMFAULT_NCS_BT_METRICS=n
CONFIG_MEMFAULT_NCS_LTE_METRICS=n
CONFIG_MEMFAULT_NCS_LOCATION_METRICS=n
CONFIG_MEMFAULT_HEAP_STATS=n
CONFIG_MEMFAULT_COREDUMP_COLLECT_KERNEL_REGION=n
CONFIG_MEMFAULT_COREDUMP_COLLECT_TASKS_REGIONS=n
CONFIG_MEMFAULT_COREDUMP_COMPUTE_THREAD_STACK_USAGE=n
CONFIG_MEMFAULT_REBOOT_REASON_GET_BASIC=y
CONFIG_MEMFAULT_SOFTWARE_WATCHDOG_CUSTOM=y
CONFIG_MEMFAULT_BUILTIN_DEVICE_INFO_SOFTWARE_TYPE="bm-ble-throughput"
CONFIG_MEMFAULT_BUILTIN_DEVICE_INFO_SOFTWARE_VERSION="0.1.0"
CONFIG_MEMFAULT_BUILTIN_DEVICE_INFO_HARDWARE_VERSION="nRF54L15DK"

# Memfault demo shell commands use heap for a few test paths.
CONFIG_HEAP_MEM_POOL_SIZE=1024
